<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 - Like IT</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="article-form-container">
            <h2 class="article-form-title" data-element-key="ARTICLE_FORM_TITLE">게시글 작성</h2>

            <form class="article-form" data-element-key="ARTICLE_FORM">
                <input type="hidden" data-element-key="ARTICLE_ID">

                <div class="form-group">
                    <label class="form-label required">제목</label>
                    <input
                        type="text"
                        data-element-key="ARTICLE_TITLE"
                        name="title"
                        class="form-input"
                        placeholder="제목을 입력해주세요 (최대 26글자)"
                        maxlength="26"
                        required
                    >
                    <span class="form-helper" data-element-key="ARTICLE_TITLE_ERROR"></span>
                </div>

                <div class="form-group">
                    <label class="form-label required">내용</label>
                    <textarea
                        data-element-key="ARTICLE_CONTENT_INPUT"
                        name="content"
                        class="form-textarea"
                        placeholder="내용을 입력해주세요"
                        required
                    ></textarea>
                    <span class="form-helper" data-element-key="ARTICLE_CONTENT_ERROR"></span>
                </div>

                <div class="form-group">
                    <label class="form-label">이미지</label>
                    <div class="file-upload">
                        <button type="button" class="file-upload-btn" data-element-key="ARTICLE_FILE_UPLOAD_BTN">
                            파일 선택
                        </button>
                        <span class="file-upload-text" data-element-key="ARTICLE_FILE_NAME_TEXT">파일을 선택해주세요.</span>
                        <input
                            type="file"
                            data-element-key="ARTICLE_IMAGE_INPUT"
                            name="image"
                            accept="image/*"
                            style="display: none;"
                        >
                    </div>
                    <div class="article-image-preview" data-element-key="ARTICLE_IMAGE_PREVIEW" style="display: none;">
                        <img data-element-key="ARTICLE_PREVIEW_IMG" alt="미리보기">
                    </div>
                    <span class="form-helper" data-element-key="ARTICLE_IMAGE_ERROR"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-3" data-element-key="ARTICLE_SUBMIT_BTN">완료</button>
            </form>
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('article');

        import '/js/common/uris.js';
        import '/js/common/domElements.js';
    </script>
    <script type="module">
        import { initArticleFormPage } from '/js/handler/article/formHandler.js';
        import { initAuthHeader } from '/js/handler/user/userEditHandler.js';
        import { loadHeader } from '/js/common/fragment-loader.js';
        import { DomElements } from '/js/common/domElements.js';
        import { eventManager } from '/js/common/event.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const pathParts = window.location.pathname.split('/');
            const isEditMode = pathParts.length > 3 && pathParts[3] === 'edit';
            const articleIdForEdit = isEditMode ? pathParts[2] : null;

            await loadHeader('with-back');
            // Re-initialize DomElements after loading header to ensure all elements have IDs
            DomElements.initialize();
            initAuthHeader();
            await initArticleFormPage(articleIdForEdit);

            const backBtn = DomElements.Common.getBackBtn();
            if (backBtn) {
                eventManager.add(backBtn, 'click', () => history.back());
            }
        });
    </script>
</body>
</html>
