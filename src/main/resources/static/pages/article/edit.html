<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 - 아무 말 대잔치</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="article-form-container">
            <h2 class="article-form-title" id="formTitle">게시글 작성</h2>

            <form class="article-form" id="articleForm">
                <input type="hidden" id="articleId">

                <div class="form-group">
                    <label for="title" class="form-label required">제목</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-input"
                        placeholder="제목을 입력해주세요 (최대 26글자)"
                        maxlength="26"
                        required
                    >
                    <span class="form-helper" id="titleError"></span>
                </div>

                <div class="form-group">
                    <label for="content" class="form-label required">내용</label>
                    <textarea
                        id="content"
                        name="content"
                        class="form-textarea"
                        placeholder="내용을 입력해주세요"
                        required
                    ></textarea>
                    <span class="form-helper" id="contentError"></span>
                </div>

                <div class="form-group">
                    <label class="form-label">이미지</label>
                    <div class="file-upload">
                        <button type="button" class="file-upload-btn" id="fileUploadBtn">
                            파일 선택
                        </button>
                        <span class="file-upload-text" id="fileNameText">파일을 선택해주세요.</span>
                        <input
                            type="file"
                            id="imageInput"
                            name="image"
                            accept="image/*"
                            style="display: none;"
                        >
                    </div>
                    <div class="article-image-preview" id="imagePreview" style="display: none;">
                        <img id="previewImg" alt="미리보기">
                    </div>
                    <span class="form-helper" id="imageError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-3" id="submitBtn">완료</button>
            </form>
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('article');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';
    </script>
    <script src="/js/common/fragment-loader.js"></script>
    <script type="module">
        import { initArticleFormPage } from '/js/article/articleHandler.js';
        import { initAuthHeader } from '/js/user/userHandler.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const pathParts = window.location.pathname.split('/');
            const isEditMode = pathParts.length > 3 && pathParts[3] === 'edit';
            const articleIdForEdit = isEditMode ? pathParts[2] : null;

            await loadHeader('with-back');
            initAuthHeader();
            await initArticleFormPage(articleIdForEdit);

            const backBtn = document.getElementById('backBtn');
            backBtn?.addEventListener('click', () => history.back());
        });
    </script>
</body>
</html>
