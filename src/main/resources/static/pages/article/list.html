<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 - Like IT</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="article-list-header">
            <div class="article-list-intro-wrapper">
                <p class="article-list-intro">
                    안녕하세요,<br>
                    Like IT <strong>게시판</strong> 입니다.
                </p>
            </div>
        </div>

        <div class="article-list" data-element-key="ARTICLE_LIST">
            <!-- 게시글 카드들이 JavaScript로 동적으로 추가됩니다 -->
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('article');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';

        // domElements.js import
        import '/js/common/ui/domElements.js';
    </script>
    <script type="module">
        import { initArticleListPage } from '/js/handler/article/listHandler.js';
        import { initAuthHeader } from '/js/handler/user/userEditHandler.js';
        import { DomElements } from '/js/common/ui/domElements.js';
        import { loadHeader } from '/js/common/ui/fragment-loader.js';
        import { initializeHeaderUserInfo } from '/js/common/ui/headerInit.js';
        import { resetCsrfToken } from '/js/common/auth/csrf.js';

        document.addEventListener('DOMContentLoaded', async () => {
            // CSRF 토큰 초기화
            await resetCsrfToken();

            await loadHeader('with-user-menu');
            // Re-initialize DomElements after loading header to ensure all elements have IDs
            DomElements.initialize();
            initAuthHeader();
            await initializeHeaderUserInfo();  // Load user info
            initArticleListPage();
        });
    </script>
</body>
</html>
