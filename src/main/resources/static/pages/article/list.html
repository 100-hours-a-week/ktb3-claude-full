<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 - 아무 말 대잔치</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="article-list-header">
            <p class="article-list-intro">
                안녕하세요,<br>
                아무 말 대잔치 <strong>게시판</strong> 입니다.
            </p>
            <a href="#" class="btn btn-primary article-create-btn" data-element-key="CREATE_ARTICLE_BTN">게시글 작성</a>
        </div>

        <div class="article-list" data-element-key="ARTICLE_LIST">
            <!-- 게시글 카드들이 JavaScript로 동적으로 추가됩니다 -->
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('article');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';

        // domElements.js import
        import '/js/common/domElements.js';
    </script>
    <script type="module">
        import { initArticleListPage } from '/js/article/articleHandler.js';
        import { initAuthHeader } from '/js/user/userHandler.js';
        import { PageRoutes } from '/js/common/uris.js';
        import { DomElements } from '/js/common/domElements.js';
        import { loadHeader } from '/js/common/fragment-loader.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadHeader('with-user-menu');
            // Re-initialize DomElements after loading header to ensure all elements have IDs
            DomElements.initialize();
            initAuthHeader();
            initArticleListPage();

            const createArticleBtn = DomElements.Common.getCreateArticleBtn();
            createArticleBtn?.addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = PageRoutes.ARTICLE_NEW;
            });
        });
    </script>
</body>
</html>
