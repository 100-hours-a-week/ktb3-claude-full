<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 - Like IT</title>
</head>
<body class="article-detail-body">
    <div id="header-container"></div>

    <main class="main-content article-detail-main">
        <section class="article-detail-container">
            <section class="article-detail-card article-detail-header" data-element-key="ARTICLE_HEADER"></section>

            <section class="article-detail-card article-detail-image-container" data-element-key="ARTICLE_IMAGE_CONTAINER">
            <div class="article-image-placeholder">등록된 이미지가 없습니다.</div>
            </section>

            <section class="article-detail-card article-detail-content" data-element-key="ARTICLE_CONTENT"></section>

            <section class="article-detail-card article-detail-stats" data-element-key="ARTICLE_STATS"></section>

            <section class="article-detail-card comment-section">
                <h3 class="comment-section-title" data-element-key="COMMENT_FORM_TITLE">댓글 0개</h3>
                <form class="comment-form" data-element-key="COMMENT_FORM">
                    <div class="comment-form-header">
                        <button type="button" class="comment-form-reset" data-element-key="COMMENT_RESET_BTN">취소</button>
                    </div>
                    <div class="form-group">
                        <textarea
                            data-element-key="COMMENT_CONTENT"
                            name="content"
                            class="form-textarea"
                            placeholder="댓글을 남겨주세요!"
                            required
                        ></textarea>
                    </div>
                    <button
                        type="submit"
                        class="btn btn-primary comment-submit-btn btn-comment-disabled"
                        data-element-key="COMMENT_SUBMIT_BTN"
                        disabled
                    >
                        댓글 등록
                    </button>
                </form>

                <div class="comment-list" data-element-key="COMMENT_LIST"></div>
            </section>
        </section>

        <aside class="article-toc" data-element-key="ARTICLE_TOC" style="display: none;">
            <div class="article-toc-title">목차</div>
            <nav class="article-toc-nav" data-element-key="ARTICLE_TOC_NAV"></nav>
        </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script type="module">
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('article');
        import '/js/common/uris.js';
        import '/js/common/domElements.js';
    </script>
    <script type="module">
        import { initArticleDetailPage } from '/js/handler/article/detailHandler.js';
        import { initAuthHeader } from '/js/handler/user/userEditHandler.js';
        import { loadHeader } from '/js/common/fragment-loader.js';
        import { DomElements } from '/js/common/domElements.js';
        import { initializeHeaderUserInfo } from '/js/common/headerInit.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadHeader('with-back');
            // Re-initialize DomElements after loading header to ensure all elements have IDs
            DomElements.initialize();
            initAuthHeader();
            await initializeHeaderUserInfo();  // Load user info
            await initArticleDetailPage();
        });
    </script>
</body>
</html>
