<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세 - 아무 말 대잔치</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content article-detail-main">
        <div class="article-detail-container">
            <div class="article-detail-header" data-element-key="ARTICLE_HEADER"></div>

            <div data-element-key="ARTICLE_IMAGE_CONTAINER"></div>

            <div class="article-detail-content" data-element-key="ARTICLE_CONTENT"></div>

            <div class="article-detail-stats" data-element-key="ARTICLE_STATS"></div>

            <div class="article-like-section">
                <button type="button" class="article-like-button" id="articleLikeBtn" data-liked="false">🤍 좋아요</button>
                <div class="article-like-meta">
                    <span class="article-like-count-label">좋아요 수</span>
                    <span class="article-like-count" id="articleLikeCount">0</span>
                </div>
            </div>

            <div class="comment-section">
                <form class="comment-form" id="commentForm">
                    <div class="comment-form-header">
                        <h3 class="comment-form-title" id="commentFormTitle">댓글을 남겨주세요!</h3>
                        <button type="button" class="comment-form-reset" id="commentResetBtn">취소</button>
                    </div>
                    <div class="form-group">
                        <textarea
                            id="commentContent"
                            name="content"
                            class="form-textarea"
                            placeholder="댓글을 남겨주세요!"
                            required
                        ></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary comment-submit-btn btn-comment-disabled" id="commentSubmitBtn" disabled>댓글 등록</button>
                </form>

                <div class="comment-list" id="commentList"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('article');
        import '/js/common/uris.js';
    </script>
    <script src="/js/common/fragment-loader.js"></script>
    <script type="module">
        import { initArticleDetailPage } from '/js/article/articleHandler.js';
        import { initAuthHeader } from '/js/user/userHandler.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadHeader('with-back');
            initAuthHeader();
            await initArticleDetailPage();
        });
    </script>
</body>
</html>
