<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 수정 - 아무 말 대잔치</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="password-update-container">
            <h2 class="password-update-title">비밀번호 수정</h2>

            <form class="password-update-form" id="passwordUpdateForm">
                <div class="form-group">
                    <label for="currentPassword" class="form-label required">비밀번호</label>
                    <input
                        type="password"
                        id="currentPassword"
                        name="currentPassword"
                        class="form-input"
                        placeholder="비밀번호를 입력하세요"
                        required
                    >
                    <span class="form-helper" id="currentPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="newPassword" class="form-label required">비밀번호 확인</label>
                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        class="form-input"
                        placeholder="비밀번호를 한번 더 입력하세요"
                        required
                    >
                    <span class="form-helper" id="newPasswordError"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-3">수정하기</button>
            </form>
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('user');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';
    </script>
    <script src="/js/common/fragment-loader.js"></script>
    <script type="module">
        import { initPasswordPage, initAuthHeader } from '/js/user/userHandler.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadHeader('with-user-menu');
            initAuthHeader();
            initPasswordPage();
        });
    </script>
</body>
</html>
