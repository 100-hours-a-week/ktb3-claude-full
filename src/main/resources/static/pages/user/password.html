<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 수정 - Like IT</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="password-update-container">
            <h2 class="password-update-title">비밀번호 수정</h2>

            <form class="password-update-form" data-element-key="PASSWORD_UPDATE_FORM">
                <div class="form-group">
                    <label class="form-label required">비밀번호</label>
                    <input
                        type="password"
                        data-element-key="PASSWORD_CURRENT"
                        name="currentPassword"
                        class="form-input"
                        placeholder="비밀번호를 입력하세요"
                        required
                    >
                    <span class="form-helper" data-element-key="PASSWORD_CURRENT_ERROR"></span>
                </div>

                <div class="form-group">
                    <label class="form-label required">비밀번호 확인</label>
                    <input
                        type="password"
                        data-element-key="PASSWORD_NEW"
                        name="newPassword"
                        class="form-input"
                        placeholder="비밀번호를 한번 더 입력하세요"
                        required
                    >
                    <span class="form-helper" data-element-key="PASSWORD_NEW_ERROR"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-3">수정하기</button>
            </form>
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('user');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';
    </script>
    <script type="module">
        import { initPasswordPage, initAuthHeader } from '/js/handler/user/userEditHandler.js';
        import { DomElements } from '/js/common/domElements.js';
        import { loadHeader } from '/js/common/fragment-loader.js';
        import { initializeHeaderUserInfo } from '/js/common/headerInit.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadHeader('with-back');
            // Re-initialize DomElements after loading header to ensure all elements have IDs
            DomElements.initialize();
            initAuthHeader();
            await initializeHeaderUserInfo();  // Load user info
            initPasswordPage();
        });
    </script>
</body>
</html>
