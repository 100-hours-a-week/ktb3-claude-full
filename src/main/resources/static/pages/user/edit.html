<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 수정 - 아무 말 대잔치</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="user-edit-container">
            <h2 class="user-edit-title">회원정보수정</h2>

            <form class="user-edit-form" id="userEditForm">
                <div class="user-edit-profile">
                    <label class="profile-label">프로필 사진*</label>
                    <div class="profile-image-container">
                        <div class="profile-image" id="profileImageClickArea">
                            <img id="profilePreviewImg" style="display: none;">
                            <span class="profile-image-placeholder">+</span>
                            <div class="profile-image-change">변경</div>
                        </div>
                    </div>
                    <input
                        type="file"
                        id="profileImageInput"
                        name="profileImage"
                        accept="image/*"
                        style="display: none;"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">이메일*</label>
                    <div class="user-email-display" id="userEmail">example@example.com</div>
                </div>

                <div class="form-group">
                    <label for="nickname" class="form-label required">닉네임</label>
                    <input
                        type="text"
                        id="nickname"
                        name="nickname"
                        class="form-input"
                        placeholder="닉네임을 입력하세요"
                        required
                    >
                    <span class="form-helper" id="nicknameError"></span>
                </div>

                <div class="user-actions">
                    <button type="submit" class="btn btn-primary btn-full">수정하기</button>
                    <button type="button" class="btn btn-danger btn-full" id="deleteAccountBtn">회원 탈퇴</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('user');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';
    </script>
    <script src="/js/common/fragment-loader.js"></script>
    <script type="module">
        import { initUserEditPage, initAuthHeader } from '/js/user/userHandler.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadHeader('with-user-menu');
            initAuthHeader();
            await initUserEditPage();
        });
    </script>
</body>
</html>
