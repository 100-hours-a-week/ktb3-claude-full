<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 수정 - Like IT</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="user-edit-container">
            <h2 class="user-edit-title">회원정보수정</h2>

            <form class="user-edit-form" data-element-key="USER_EDIT_FORM">
                <div class="user-edit-profile">
                    <label class="profile-label">프로필 사진*</label>
                    <div class="profile-image-container">
                        <div class="profile-image" data-element-key="USER_PROFILE_IMAGE_CLICK_AREA">
                            <img data-element-key="USER_PROFILE_PREVIEW_IMG" style="display: none;">
                            <span class="profile-image-placeholder" data-element-key="USER_PROFILE_IMAGE_PLACEHOLDER">+</span>
                            <div class="profile-image-change">변경</div>
                        </div>
                    </div>
                    <input
                        type="file"
                        data-element-key="USER_PROFILE_IMAGE_INPUT"
                        name="profileImage"
                        accept="image/*"
                        style="display: none;"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">이메일*</label>
                    <div class="user-email-display" data-element-key="USER_EMAIL">example@example.com</div>
                </div>

                <div class="form-group">
                    <label for="nickname" class="form-label required">닉네임</label>
                    <input
                        type="text"
                        data-element-key="USER_NICKNAME"
                        name="nickname"
                        class="form-input"
                        placeholder="닉네임을 입력하세요"
                        required
                    >
                    <span class="form-helper" data-element-key="USER_NICKNAME_ERROR"></span>
                </div>

                <div class="user-actions">
                    <button type="submit" class="btn btn-primary btn-full">수정하기</button>
                    <button type="button" class="btn btn-danger btn-full" data-element-key="USER_DELETE_ACCOUNT_BTN">회원 탈퇴</button>
                </div>
            </form>
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('user');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';
    </script>
    <script type="module">
        import { initUserEditPage, initAuthHeader } from '/js/handler/user/userEditHandler.js';
        import { DomElements } from '/js/common/ui/domElements.js';
        import { loadHeader } from '/js/common/ui/fragment-loader.js';
        import { initializeHeaderUserInfo } from '/js/common/ui/headerInit.js';
        import { resetCsrfToken } from '/js/common/auth/csrf.js';

        document.addEventListener('DOMContentLoaded', async () => {
            // CSRF 토큰 초기화
            await resetCsrfToken();

            await loadHeader('with-back');
            // Re-initialize DomElements after loading header to ensure all elements have IDs
            DomElements.initialize();
            initAuthHeader();
            await initializeHeaderUserInfo();  // Load user info
            await initUserEditPage();
        });
    </script>
</body>
</html>
