<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Like IT</title>
</head>
<body>
    <div id="header-container"></div>

    <main class="main-content">
        <div class="auth-container">
            <h2 class="auth-title">회원가입</h2>

            <form class="auth-form" data-element-key="SIGNUP_FORM">
                <div class="form-group">
                    <label class="form-label required">프로필 사진</label>
                    <div class="profile-upload">
                        <div class="profile-upload-image" data-element-key="SIGNUP_PROFILE_PREVIEW">
                            <img data-element-key="SIGNUP_PREVIEW_IMG" style="display: none;">
                        </div>
                        <input
                            type="file"
                            data-element-key="SIGNUP_PROFILE_IMAGE"
                            name="profileImage"
                            class="profile-upload-input"
                            accept="image/*"
                        >
                    </div>
                    <span class="form-helper" data-element-key="SIGNUP_PROFILE_ERROR"></span>
                </div>

                <div class="form-group">
                    <label class="form-label required">이메일</label>
                    <input
                        type="text"
                        data-element-key="SIGNUP_EMAIL"
                        name="email"
                        class="form-input"
                        placeholder="이메일을 입력하세요"
                    >
                    <span class="form-helper" data-element-key="SIGNUP_EMAIL_ERROR"></span>
                </div>

                <div class="form-group">
                    <label class="form-label required">비밀번호</label>
                    <input
                        type="password"
                        data-element-key="SIGNUP_PASSWORD"
                        name="password"
                        class="form-input"
                        placeholder="비밀번호를 입력하세요"
                    >
                    <span class="form-helper" data-element-key="SIGNUP_PASSWORD_ERROR"></span>
                </div>

                <div class="form-group">
                    <label class="form-label required">비밀번호 확인</label>
                    <input
                        type="password"
                        data-element-key="SIGNUP_PASSWORD_CONFIRM"
                        name="passwordConfirm"
                        class="form-input"
                        placeholder="비밀번호를 한번 더 입력하세요"
                    >
                    <span class="form-helper" data-element-key="SIGNUP_PASSWORD_CONFIRM_ERROR"></span>
                </div>

                <div class="form-group">
                    <label class="form-label required">닉네임</label>
                    <input
                        type="text"
                        data-element-key="SIGNUP_NICKNAME"
                        name="nickname"
                        class="form-input"
                        placeholder="닉네임을 입력하세요"
                        maxlength="10"
                    >
                    <span class="form-helper" data-element-key="SIGNUP_NICKNAME_ERROR"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-signup-disabled" data-element-key="SIGNUP_BTN" disabled>회원가입</button>
            </form>

            <div class="auth-links signup-links">
                <button type="button" class="auth-link-btn" data-element-key="LOGIN_LINK_BTN">로그인하러 가기</button>
            </div>
        </div>
    </main>

    <script type="module">
        // 스타일 로더를 먼저 import하여 스타일 주입
        import { loadStylesForPage } from '/js/styles/styleLoader.js';
        loadStylesForPage('user');

        // uris.js를 먼저 import하여 window.PageRoutes 설정
        import '/js/common/uris.js';

        // domElements.js import
        import '/js/common/domElements.js';
    </script>
    <script type="module">
        import { initSignupPage } from '/js/handler/user/signupHandler.js';
        import { PageRoutes } from '/js/common/uris.js';
        import { DomElements } from '/js/common/domElements.js';
        import { loadHeader } from '/js/common/fragment-loader.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await loadHeader('auth-with-back');
            // Re-initialize DomElements after loading header to ensure all elements have IDs
            DomElements.initialize();

            const backBtn = DomElements.Common.getBackBtn();
            backBtn?.addEventListener('click', () => history.back());

            const profilePreview = DomElements.Signup.getProfilePreview();
            const profileImage = DomElements.Signup.getProfileImage();
            profilePreview?.addEventListener('click', () => profileImage?.click());

            initSignupPage();

            const goToLoginBtn = DomElements.manager.get('loginLinkBtn');
            goToLoginBtn?.addEventListener('click', () => (window.location.href = PageRoutes.USER_LOGIN));
        });
    </script>
</body>
</html>
