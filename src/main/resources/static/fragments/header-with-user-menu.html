<header class="header">
    <div class="header-container">
        <div class="header-left">
            <a href="#" class="btn btn-primary header-create-btn" data-element-key="HEADER_CREATE_ARTICLE_BTN" style="display: none;">게시글 작성</a>
        </div>
        <h1 class="header-title" data-route="HOME" style="cursor: pointer;">Like IT</h1>
        <div class="header-right">
            <button class="notification-btn" type="button" aria-label="알림">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
            </button>
            <div class="user-menu">
                <button class="user-menu-btn" data-element-key="USER_MENU_BTN" id="userMenuBtn" type="button">
                    <svg class="user-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="10" r="3"/>
                        <path d="M6.168 18.849A6 6 0 0 1 12 15a6 6 0 0 1 5.832 3.849"/>
                    </svg>
                    <span class="user-name" data-element-key="HEADER_USER_NAME">사용자</span>
                    <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
                <div class="user-menu-dropdown" id="userMenuDropdown" style="display: none;">
                    <div class="dropdown-header">
                        <div class="dropdown-user-avatar"></div>
                        <span class="dropdown-user-name" data-element-key="HEADER_DROPDOWN_USER_NAME">사용자</span>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="#" data-route="USER_EDIT" class="menu-item">회원정보수정</a>
                    <a href="#" data-route="USER_PASSWORD" class="menu-item">비밀번호수정</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="menu-item menu-item-logout" id="logoutBtn">로그아웃</a>
                </div>
            </div>
        </div>
    </div>
</header>
